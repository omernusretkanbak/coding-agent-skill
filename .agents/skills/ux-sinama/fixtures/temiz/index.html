<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Temiz sayfa (test fixture'ı)</title>
<link rel="icon" href="data:,">
<style>
  :root { color-scheme: light dark; }
  body { font-family: sans-serif; font-size: 16px; margin: 0; padding: 16px; max-width: 100%; box-sizing: border-box; background: #fff; color: #111; }
  @media (prefers-color-scheme: dark) { body { background: #111; color: #eee; } input { background: #222; color: #eee; } }
  label { display: block; margin-bottom: 8px; }
  input[type=text] { width: 100%; max-width: 320px; min-height: 44px; font-size: 16px; box-sizing: border-box; }
  button { min-width: 44px; min-height: 44px; font-size: 16px; }
  #durum { min-height: 24px; margin-top: 12px; }
</style>
</head>
<body>
<h1>Temiz sayfa</h1>
<h2>Kayıt formu</h2>
<img width="40" height="40" alt="Logo" src="data:image/gif;base64,R0lGODlhAQABAIAAAAAAAP///yH5BAEAAAAALAAAAAABAAEAAAIBRAA7">
<form id="form">
  <label for="ad">Ad</label>
  <input id="ad" type="text" autocomplete="off">
  <button type="submit">Kaydet</button>
</form>
<p id="durum" role="status"></p>
<script>
  document.getElementById('form').addEventListener('submit', function (e) {
    e.preventDefault();
    var ad = document.getElementById('ad').value;
    setTimeout(function () {
      document.getElementById('durum').textContent = 'Kaydedildi: ' + ad;
    }, 150);
  });
</script>
</body>
</html>
